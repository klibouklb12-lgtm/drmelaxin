# ============================================================================
#  Auto-deploy to GitHub Pages on every push to main
# ============================================================================
#  Setup (one-time, in GitHub repo settings):
#  1. Go to: Settings → Pages → Build and deployment → Source: GitHub Actions
#  2. Set repository env vars: Settings → Secrets and variables → Actions → Variables
#     - NEXT_PUBLIC_GOOGLE_SHEET_URL (required)
#     - NEXT_PUBLIC_CDN_BASE (optional, for jsDelivr CDN)
#     - NEXT_PUBLIC_BASE_PATH (set to /REPO_NAME if NOT using a custom domain)
# ============================================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build static export
        env:
          NEXT_PUBLIC_GOOGLE_SHEET_URL: ${{ vars.NEXT_PUBLIC_GOOGLE_SHEET_URL }}
          NEXT_PUBLIC_CDN_BASE: ${{ vars.NEXT_PUBLIC_CDN_BASE }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
